# XcodeGen 工程描述（仅参考，与已入库的 ChenYuBang.xcodeproj 保持同步）。
# 规范 §13.1：xcodeproj 已入库，CI 不运行 xcodegen、不用 CocoaPods；依赖走 SPM（Package.swift）。
name: ChenYuBang
options:
  bundleIdPrefix: com.chenyubang
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.2"

packages:
  ChenYuBangKit:
    path: .
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    exactVersion: 1.17.7

targets:
  ChenYuBang:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - Resources
      - path: Sources/Features
      - path: Sources/App/Resources
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties: {}
    dependencies:
      - package: ChenYuBangKit
        product: CangyuDesignSystem
      - package: ChenYuBangKit
        product: CangyuData
      - package: ChenYuBangKit
        product: CangyuTokens
      - package: GRDB.swift
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenyubang.app
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  ChenYuBangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures/pack/pack-v1.0.0.zip
        buildPhase: resources
      - path: Tests/Fixtures/pack/pack-mock-v0.0.1.zip
        buildPhase: resources
    dependencies:
      - target: ChenYuBang
      - package: ChenYuBangKit
        product: CangyuTokens
      - package: ChenYuBangKit
        product: CangyuData
      - package: GRDB.swift
        product: GRDB
      - package: swift-snapshot-testing
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenyubang.app.tests
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ChenYuBang:
    build:
      targets:
        ChenYuBang: all
    test:
      targets:
        - ChenYuBangTests
