name: CI

on:
  # 2026-11-23 版内修订（规范第 13.1 节）：仅 PR 触发 + 路径过滤；push: main 重复轮移除，
  # 纯 Android / docs 改动不触发 iOS CI（Android 前置＝本机门禁）
  pull_request:
    paths:
      - "app-ios/**"
      - "shared/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      record:
        description: "iOS 快照录制引导（true=record 并上传产物、轮次绿色退出；默认 false=verify 门禁）"
        type: boolean
        default: false
      ios_snapshot_scope:
        description: "iOS 测试范围（representative 仅验证按钮/转圈/图片占位，不代表完整门禁）"
        type: choice
        options:
          - all
          - representative
        default: all
      test_filter:
        description: "仅录制轮：测试类名（拼为 -only-testing:ChenYuBangTests/<类名>），空=全量"
        type: string
        default: ""

# 同一分支有新提交时取消上一轮未完成的运行，避免重复消耗
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 部署目标守卫（iOS 15.0；规范 §13.1）
        run: |
          set -euo pipefail
          cd app-ios
          grep -q '\.iOS(\.v15)' Package.swift
          total=$(grep -c 'IPHONEOS_DEPLOYMENT_TARGET' ChenYuBang.xcodeproj/project.pbxproj || true)
          ok=$(grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' ChenYuBang.xcodeproj/project.pbxproj || true)
          echo "pbxproj 部署目标：$ok/$total 处为 15.0"
          if [ "$total" -eq 0 ] || [ "$ok" -ne "$total" ]; then
            grep 'IPHONEOS_DEPLOYMENT_TARGET' ChenYuBang.xcodeproj/project.pbxproj || true
            echo "::error::部署目标必须全部为 15.0；宿主 runner 无 iOS 15 运行时，实跑验证后置本机（规范 §13.1）"
            exit 1
          fi
      - name: 静态检查（SwiftLint，零 error 阻断；规范 §2.1 / §13.1）
        run: |
          brew install swiftlint
          cd app-ios
          swiftlint lint --strict
      - name: Cache SPM packages (restore latest; unique key per run)
        uses: actions/cache@v4
        with:
          path: app-ios/.spm-packages
          key: spm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: 解析 SPM 依赖（xcodeproj 已入库，不生成、不用 CocoaPods；规范 §13.1）
        run: |
          cd app-ios
          xcodebuild -resolvePackageDependencies \
            -clonedSourcePackagesDirPath .spm-packages \
            -project ChenYuBang.xcodeproj -scheme ChenYuBang
      - name: 编译
        run: |
          cd app-ios
          xcodebuild -project ChenYuBang.xcodeproj -scheme ChenYuBang \
            -clonedSourcePackagesDirPath .spm-packages \
            -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
      - name: 录制前测试编译预检（record=true；快照预期失败不得掩盖编译失败）
        if: github.event.inputs.record == 'true'
        run: |
          cd app-ios
          SNAPSHOT_RECORD=0 TEST_RUNNER_SNAPSHOT_RECORD=0 xcodebuild \
            -project ChenYuBang.xcodeproj -scheme ChenYuBang \
            -clonedSourcePackagesDirPath .spm-packages \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            build-for-testing CODE_SIGNING_ALLOWED=NO
      - name: 单测 + 快照比对（swift-snapshot-testing 作为 test 的一部分；规范 §13 / §13.1）
        # Record runs fail every snapshot by design; continue-on-error keeps the run green
        continue-on-error: ${{ github.event.inputs.record == 'true' }}
        env:
          SNAPSHOT_RECORD: ${{ github.event.inputs.record == 'true' && '1' || '' }}
          TEST_RUNNER_SNAPSHOT_RECORD: ${{ github.event.inputs.record == 'true' && '1' || '' }}
          IOS_SNAPSHOT_SCOPE: ${{ github.event.inputs.ios_snapshot_scope || 'all' }}
          TEST_FILTER: ${{ github.event.inputs.test_filter || '' }}
        run: |
          cd app-ios
          test_args=()
          case "$IOS_SNAPSHOT_SCOPE" in
            all) ;;
            representative)
              test_args+=(
                -only-testing:ChenYuBangTests/CButtonSnapshotTests
                -only-testing:ChenYuBangTests/CSpinnerSnapshotTests
                -only-testing:ChenYuBangTests/CImagePlaceholderSnapshotTests
              )
              ;;
            *) exit 2 ;;
          esac
          if [[ -n "$TEST_FILTER" ]]; then
            if [[ "$TEST_RUNNER_SNAPSHOT_RECORD" != 1 ]]; then
              echo "::error::test_filter only allowed with record=true; verify gate stays full scope"
              exit 2
            fi
            if [[ "$IOS_SNAPSHOT_SCOPE" != all ]]; then
              echo "::error::test_filter and representative are mutually exclusive"
              exit 2
            fi
            test_args+=("-only-testing:ChenYuBangTests/$TEST_FILTER")
          fi
          rm -rf .xcresult
          xcodebuild -project ChenYuBang.xcodeproj -scheme ChenYuBang \
            -clonedSourcePackagesDirPath .spm-packages \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath .xcresult/ios-results.xcresult \
            "${test_args[@]}" test CODE_SIGNING_ALLOWED=NO
          if [[ "$IOS_SNAPSHOT_SCOPE" == representative && "$TEST_RUNNER_SNAPSHOT_RECORD" == 1 ]]; then
            SNAPSHOT_RECORD=0 TEST_RUNNER_SNAPSHOT_RECORD=0 xcodebuild \
              -project ChenYuBang.xcodeproj -scheme ChenYuBang \
              -clonedSourcePackagesDirPath .spm-packages \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -resultBundlePath .xcresult/ios-recheck.xcresult \
              "${test_args[@]}" test CODE_SIGNING_ALLOWED=NO
          fi
      - name: 上传快照基线产物（首次录制引导 / 失败时取回审阅；规范 §11.1）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshots
          path: app-ios/Tests/__Snapshots__
          if-no-files-found: ignore
      - name: 上传 xcresult（仅 verify 失败；规范第 11.2、13.1 节，供定向提取实际帧审阅）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: app-ios/.xcresult
          if-no-files-found: ignore
