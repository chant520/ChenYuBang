name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens-and-schema:
    name: 令牌与 schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 令牌漂移检查
        run: python tools/gen_tokens.py --check
      - name: schema 与 fixtures 校验（含备份包 sha256 与题库包合并摘要成功/失败两条断言，规范 v1.4 §4.5）
        run: python tools/validate_schema.py
      - name: 截图基线是否与 v2 稿同步
        run: python tools/baseline.py --check

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 编译与单测
        run: gradle -p app-android :app:assembleDebug test
      - name: 静态检查（ktlint / detekt，零 error 阻断）
        run: gradle -p app-android ktlintCheck detekt
      - name: Lint
        run: gradle -p app-android :app:lintDebug
      - name: 快照比对（Roborazzi 与基线比对，CI 必跑；规范 §13 / §13.1）
        run: gradle -p app-android :core-ui:verifyRoborazziDebug

  ios:
    name: iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 静态检查（SwiftLint，零 error 阻断；规范 §2.1 / §13.1）
        run: |
          brew install swiftlint
          cd app-ios
          swiftlint lint --strict
      - name: 解析 SPM 依赖（xcodeproj 已入库，不生成、不用 CocoaPods；规范 §13.1）
        run: |
          cd app-ios
          xcodebuild -resolvePackageDependencies \
            -project ChenYuBang.xcodeproj -scheme ChenYuBang
      - name: 编译
        run: |
          cd app-ios
          xcodebuild -project ChenYuBang.xcodeproj -scheme ChenYuBang \
            -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
      - name: 单测 + 快照比对（swift-snapshot-testing 作为 test 的一部分；规范 §13 / §13.1）
        run: |
          cd app-ios
          xcodebuild -project ChenYuBang.xcodeproj -scheme ChenYuBang \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            test CODE_SIGNING_ALLOWED=NO
